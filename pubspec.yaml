name: kilife
description: SkinFlow — a private, offline skincare routine tracker with Android notifications.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.2.0
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  drift_dev: 2.34.0
